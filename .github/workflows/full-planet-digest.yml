name: Full Planet daily digest

# Rebuilds Full_Planet/data/digest.json from the RSS feeds each day and commits
# it, so the Full Planet pages on your GitHub site show fresh headlines.

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser

      - name: Build the digest
        working-directory: Full_Planet
        run: python build_digest.py

      - name: Commit updated digest
        run: |
          git config user.name  "full-planet-bot"
          git config user.email "actions@github.com"
          git add Full_Planet/data/digest.json
          if git diff --staged --quiet; then
            echo "No changes today."
          else
            git commit -m "Full Planet daily digest: $(date -u '+%Y-%m-%d')"
            git push
          fi
