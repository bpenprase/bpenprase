name: Full Planet daily digest

on:
  schedule:
    - cron: "0 9 * * *"    # 09:00 UTC daily — adjust to taste
  workflow_dispatch:         # lets you trigger a build by hand from the Actions tab

permissions:
  contents: write            # allows the action to commit the updated digest

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser google-api-python-client google-auth

      - name: Build the digest
        working-directory: Full_Planet
        run: python build_digest.py

      - name: Sync channels to Google Drive (for NotebookLM)
        working-directory: Full_Planet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: python sync_to_drive.py

      - name: Commit updated digest
        run: |
          git config user.name  "full-planet-bot"
          git config user.email "actions@github.com"
          git add Full_Planet/data/digest.json Full_Planet/data/urls
          if git diff --staged --quiet; then
            echo "No changes today."
          else
            git commit -m "Full Planet daily digest: $(date -u '+%Y-%m-%d')"
            for attempt in 1 2 3; do
              if git push; then
                echo "Pushed on attempt $attempt."
                break
              fi
              echo "Push rejected; pulling latest and retrying ($attempt)..."
              git pull --rebase --autostash origin main
            done
          fi
